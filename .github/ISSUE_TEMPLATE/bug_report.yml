name: Bug report
description: Report a problem with viatom-o2ring-daemon
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `viatom-o2ring-daemon --version`
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      description: Which command/service (e.g. viatom-o2ring-daemon, viatom-o2ring-sync-files, viatom-o2ring-report)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, and Bluetooth adapter/backend
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      render: shell
