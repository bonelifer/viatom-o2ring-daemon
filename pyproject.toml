[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viatom-o2ring-daemon"
version = "0.1.0"
description = "Standalone Linux daemon that logs Viatom/Wellue O2Ring pulse oximeter readings"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "viatom-o2ring-ble @ git+https://github.com/home-health-hub/viatom-o2ring-ble.git",
    "aiomqtt>=2.0.0,<3.0.0",
    "apprise>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/home-health-hub/viatom-o2ring-daemon"

[project.scripts]
viatom-o2ring-daemon = "viatom_o2ring_daemon.cli:main"
viatom-o2ring-sync-files = "viatom_o2ring_daemon.sync_files:main"
viatom-o2ring-report = "viatom_o2ring_daemon.report:main"
viatom-o2ring-prune = "viatom_o2ring_daemon.prune:main"
viatom-o2ring-alert-check = "viatom_o2ring_daemon.alerting:main"
viatom-o2ring-api = "viatom_o2ring_daemon.api:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/viatom_o2ring_daemon"]

[tool.hatch.metadata]
allow-direct-references = true
